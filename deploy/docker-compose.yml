# Rotacion de logs JSON de Docker (unica configuracion para todo el stack)
x-logging-default: &logging_default
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Retener mas historial en el frontal web durante la votacion
x-logging-web: &logging_web
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"

services:
  # ============================================================
  # PostgreSQL
  # ============================================================

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    logging: *logging_default

    environment:
      POSTGRES_DB: helios
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    cpu_shares: 2048

    volumes:
      - /srv/helios/postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U helios -d helios
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - helios-internal

  # ============================================================
  # RabbitMQ / Celery
  # ============================================================

  rabbitmq:
    image: rabbitmq:4.1-alpine
    restart: unless-stopped
    logging: *logging_default

    environment:
      RABBITMQ_DEFAULT_USER: helios
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    cpu_shares: 1024

    volumes:
      - /srv/helios/rabbitmq:/var/lib/rabbitmq

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - helios-internal

  # ============================================================
  # Migraciones Django
  # ============================================================

  migrate:
    image: ghcr.io/stegsindicato/helios-server:main
    restart: "no"
    logging: *logging_default

    depends_on:
      db:
        condition: service_healthy

    environment: &helios-env
      # --------------------------------------------------------
      # Django / Helios
      # --------------------------------------------------------

      DEBUG: "0"

      SECRET_KEY: ${HELIOS_SECRET_KEY}
      EMAIL_OPTOUT_SECRET: ${HELIOS_EMAIL_OPTOUT_SECRET}

      ALLOWED_HOSTS: ${HELIOS_HOST}

      SSL: "1"
      HSTS: "0"

      URL_HOST: https://${HELIOS_HOST}
      SECURE_URL_HOST: https://${HELIOS_HOST}

      # --------------------------------------------------------
      # Identidad / localización
      # --------------------------------------------------------

      SITE_TITLE: ${HELIOS_SITE_TITLE}
      TOP_LOGO_URL: /static/branding/logo.png

      LANGUAGE_CODE: gl
      TIME_ZONE: Europe/Madrid

      HELP_EMAIL_ADDRESS: ${HELP_EMAIL}

      # --------------------------------------------------------
      # Comportamiento Helios
      # --------------------------------------------------------

      MASTER_HELIOS: "0"

      SHOW_LOGIN_OPTIONS: "1"
      SHOW_USER_INFO: "1"

      HELIOS_VOTER_EMAIL_CUTOFF_WEEKS: "3"

      SESSION_COOKIE_SAMESITE: Lax

      # --------------------------------------------------------
      # Autenticación
      #
      # Temporalmente password.
      # Posteriormente añadiremos OTP @edu.xunta.gal.
      # --------------------------------------------------------

      AUTH_ENABLED_SYSTEMS: password,edu_email
      AUTH_DEFAULT_SYSTEM: password

      EDU_EMAIL_DOMAIN: edu.xunta.gal
      EDU_EMAIL_OTP_MAX_AGE: "3600"
      EDU_EMAIL_OTP_MAX_ATTEMPTS: "5"
      EDU_EMAIL_OTP_RESEND_SECONDS: "60"
      EDU_EMAIL_LINK_MAX_AGE: "86400"

      STORE_CAST_IP: "0"

      # --------------------------------------------------------
      # PostgreSQL
      # --------------------------------------------------------

      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: helios
      PGUSER: helios
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: disable

      # --------------------------------------------------------
      # Celery / RabbitMQ
      # --------------------------------------------------------

      CELERY_BROKER_URL: amqp://helios:${RABBITMQ_PASSWORD}@rabbitmq:5672//

      # --------------------------------------------------------
      # SMTP
      # --------------------------------------------------------

      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: "1"

      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      DEFAULT_FROM_NAME: ${DEFAULT_FROM_NAME}

    command:
      - /bin/sh
      - -c
      - |
        exec .venv/bin/python manage.py migrate --noinput

    networks:
      - helios-internal

  # ============================================================
  # Helios Web
  # ============================================================

  web:
    image: ghcr.io/stegsindicato/helios-server:main
    restart: unless-stopped
    logging: *logging_web
    cpu_shares: 4096

    depends_on:
      db:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    environment:
      <<: *helios-env

    command:
      - /bin/sh
      - -c
      - |
        exec .venv/bin/gunicorn wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers 4 \
          --timeout 120 \
          --access-logfile - \
          --error-logfile -

    volumes:
      - /srv/helios/media:/appmedia

    ports:
      - "127.0.0.1:8088:8000"

    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8000),5); s.close()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - helios-internal

  # ============================================================
  # Celery Worker
  # ============================================================

  worker:
    image: ghcr.io/stegsindicato/helios-server:main
    restart: unless-stopped
    logging: *logging_default
    cpu_shares: 2048

    depends_on:
      db:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    environment:
      <<: *helios-env

    command:
      - /bin/sh
      - -c
      - |
        exec .venv/bin/celery \
          --app helios \
          worker \
          --events \
          --beat \
          --concurrency 1

    volumes:
      - /srv/helios/media:/appmedia

    networks:
      - helios-internal

  # ============================================================
  # Copias de PostgreSQL (cada 15 minutos, conservar 7 dias)
  # ============================================================

  backup:
    image: postgres:16-bookworm
    restart: unless-stopped
    user: "0:0"
    cpu_shares: 128
    cpus: 0.5
    logging: *logging_default

    depends_on:
      db:
        condition: service_healthy

    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: helios
      PGUSER: helios
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGCONNECT_TIMEOUT: "10"

    volumes:
      - /srv/helios/backups:/backups

    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -Eeuo pipefail
        umask 077
        tmp=""
        trap 'if [ -n "$$tmp" ]; then rm -f "$$tmp"; fi' EXIT

        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          file="/backups/helios_$${ts}.dump"
          tmp="$${file}.partial"
          echo "[$$(date -Is)] Iniciando backup: $$file"

          if pg_dump -Fc -Z 1 -f "$$tmp" && pg_restore --list "$$tmp" >/dev/null; then
            mv "$$tmp" "$$file"
            tmp=""
            sha256sum "$$file" > "$${file}.sha256"
            find /backups -maxdepth 1 -type f \
              \( -name 'helios_*.dump' -o -name 'helios_*.dump.sha256' \) \
              -mmin +10080 -delete
            echo "[$$(date -Is)] Backup correcto: $$file"
          else
            rm -f "$$tmp"
            tmp=""
            echo "[$$(date -Is)] ERROR: fallo el backup" >&2
          fi

          now=$$(date +%s)
          delay=$$((900 - now % 900))
          sleep "$$delay"
        done

    healthcheck:
      test:
        - CMD-SHELL
        - "find /backups -maxdepth 1 -type f -name 'helios_*.dump.sha256' -mmin -45 -print -quit | grep -q ."
      interval: 15m
      timeout: 10s
      retries: 2
      start_period: 20m

    networks:
      - helios-internal

# ==============================================================
# Redes
# ==============================================================

networks:
  helios-internal:
    driver: bridge
