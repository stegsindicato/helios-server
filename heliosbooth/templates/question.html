<form onsubmit="return false;" class="prettyform" id="answer_form">
<input type="hidden" name="question_num" value="{$T.question_num}" />

<p class="question-heading">
  <b class="question-text">{$T.question.question}</b>
  <span class="question-meta">{$T.question_position} &mdash; {$T.selection_instruction}</span>
</p>

{#foreach $T.question.answers as answer}
<div class="ballot-option" id="answer_label_{$T.question_num}_{$T.answer_ordering[$T.answer$index]}">
  <input type="checkbox" class="ballot_answer" id="answer_{$T.question_num}_{$T.answer_ordering[$T.answer$index]}" name="answer_{$T.question_num}_{$T.answer_ordering[$T.answer$index]}" value="yes" onclick="BOOTH.click_checkbox({$T.question_num}, {$T.answer_ordering[$T.answer$index]}, this.checked);" />

  <label class="answer" for="answer_{$T.question_num}_{$T.answer_ordering[$T.answer$index]}">
    {$T.question.answers[$T.answer_ordering[$T.answer$index]]}

    {#if $T.question.answer_urls && $T.question.answer_urls[$T.answer_ordering[$T.answer$index]] && $T.question.answer_urls[$T.answer_ordering[$T.answer$index]] != ""}
      &nbsp;&nbsp;
      <span class="answer-more-info">
        [<a target="_blank" href="{$T.question.answer_urls[$T.answer_ordering[$T.answer$index]]}" rel="noopener noreferrer">{$T.i18n.moreInfo}</a>]
      </span>
    {#/if}
  </label>
</div>
{#/for}

<div id="warning_box" class="question-warning">
</div>

<div class="question-actions">
  <div class="question-actions-secondary">
    {#if $T.question_num != 0}
    <button class="booth-secondary-button" onclick="BOOTH.previous({$T.question_num});">{$T.i18n.previous}</button>
    {#/if}
  </div>

  <div class="question-actions-primary">
    {#if $T.question_num < $T.last_question_num}
    <button class="booth-primary-button" onclick="BOOTH.next({$T.question_num});">{$T.i18n.next}</button>
    {#/if}

    {#if $T.show_reviewall}
    <button class="booth-primary-button" onclick="BOOTH.validate_and_confirm({$T.question_num});">{$T.i18n.proceed}</button>
    {#/if}
  </div>
</div>

<br clear="both" />

</form>
